# noltbook-warden limits -- Milestone 2b.1
#
# NO SECRETS IN THIS FILE.
#
# PHASE NOTE: 2b.1 loads and validates these values but ENFORCES NONE of
# them. Admission still uses the compiled-in slots (global 8 / per-host 3,
# single class). Quotas, participant limits, rates and retention arrive in
# later 2b phases. Changing a value here today changes nothing observable.
#
# Format: key = value, '#' begins a comment. Unknown or duplicate keys are
# rejected outright. Durations use Go syntax (30s, 30m, 12h, 168h).
#
# Reload: SIGHUP validates and swaps the whole file atomically. An invalid
# file is rejected and the last-known-good configuration stays live.
# Settings marked [RESTART] are parsed and validated on SIGHUP but cannot be
# adopted by a running process; the reload log says so explicitly.

# ---------------------------------------------------------------------
# meta admission -- cheap operations: ensure-room, renew-room, issue-ticket
# Each is a single sub-20ms Galene REST call plus local DB writes.
# ---------------------------------------------------------------------
meta.global_slots                = 32      # [RESTART]
meta.host_slots                  = 8       # [RESTART]
meta.admit_wait                  = 2s

# ---------------------------------------------------------------------
# roster admission -- expensive operations: room-status, evict-participant,
# end-room. Each opens one or more fresh Galene operator websocket sessions
# (~720ms per observation; eviction 2.1s typical, ~25s worst case).
# ---------------------------------------------------------------------
roster.global_slots              = 6       # [RESTART]
roster.host_slots                = 2       # [RESTART]
roster.admit_wait                = 5s

# ---------------------------------------------------------------------
# room capacity
# NOTE: 150 rooms cannot all be occupied at once given participants.global
# below. Rooms are cheap signalling state; participants are the media cost.
# ---------------------------------------------------------------------
rooms.active_global              = 150
rooms.active_per_host            = 25

# ---------------------------------------------------------------------
# connected participants
# Media ceiling context: coturn relays 41 ports (49160-49200), Galene has
# 201 UDP ports (50000-50200). 32 is well inside both.
# ---------------------------------------------------------------------
participants.global              = 32
participants.per_room            = 16

# ---------------------------------------------------------------------
# tickets -- a ticket is permission to join, not a join
# ---------------------------------------------------------------------
tickets.live_per_room            = 32
tickets.live_per_host            = 200

# ---------------------------------------------------------------------
# TTL and lifetime
# room.max_lifetime bounds one room INCARNATION; reusing an ended room key
# starts a new incarnation and resets it.
# ---------------------------------------------------------------------
lease.min_ttl                    = 30s
lease.default_ttl                = 30m
lease.max_ttl                    = 12h
room.max_lifetime                = 24h
ticket.ttl                       = 5m
operator.token_ttl               = 2m

# Combined Galene+TURN access credential lifetime.
# MEASURED: coturn checks the REST username expiry at ALLOCATE only; an
# established allocation keeps refreshing past expiry. So this covers call
# SETUP and later RE-allocation (reconnect / ICE restart), not call duration.
# Renewal is advised at half-life and never touches the Galene room.
access.credential_ttl            = 1h

# ---------------------------------------------------------------------
# rates, per authenticated host
#
# INCONSISTENCY FLAGGED (unresolved, decide in 2b.2):
#   rate.requests_per_host_per_min = 300 sustained for the 48h
#   retain.commands_full window implies up to 864,000 command rows for a
#   single host, while caps.command_rows_per_host is 20,000 -- reachable in
#   about 67 minutes at the permitted rate.
#   These two cannot both bind as written. 300/min is intended as BURST
#   protection, not a sustained budget (expected real load is ~20 commands
#   per call). Resolution options for 2b.2:
#     (a) treat the cap as a quota rejection once reached, or
#     (b) add a separate, much lower sustained per-host rate, or
#     (c) shorten retain.commands_full for high-volume hosts.
#   Left provisional here BECAUSE 2b.1 enforces nothing.
# ---------------------------------------------------------------------
rate.rooms_per_host_per_min      = 30
rate.rooms_burst                 = 10
rate.tickets_per_host_per_min    = 120
rate.tickets_burst               = 30
rate.roster_per_host_per_min     = 20
rate.roster_burst                = 5
rate.requests_per_host_per_min   = 300
rate.requests_burst              = 60
caps.command_rows_per_host       = 20000

# ---------------------------------------------------------------------
# retention
# retain.tickets must be >= retain.commands_full so the adopt-by-(host,req)
# path never loses the ticket row it needs.
# retain.command_tombstones must be >= retain.commands_full; the compact
# tombstone is what stops a pruned request id executing a second time.
# ---------------------------------------------------------------------
retain.ended_rooms               = 168h    # 7 days
retain.tickets                   = 168h    # 7 days
retain.commands_full             = 48h
retain.command_tombstones        = 720h    # 30 days

# ---------------------------------------------------------------------
# database / WAL maintenance thresholds
# Threshold-based, NOT a fixed short timer: truncation happens when the WAL
# crosses the threshold or after meaningful pruning.
# ---------------------------------------------------------------------
db.wal_truncate_threshold_bytes  = 16777216   # 16 MiB
db.prune_batch                   = 500
db.prune_interval                = 5m
